version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: floracare-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - ./data:/app/data  # Persist ChromaDB and uploaded images
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: floracare-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000  # Internal Docker network URL
    depends_on:
      - backend
    restart: always
